# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-wm-bsp"
BBFILE_PATTERN_meta-wm-bsp = "^${LAYERDIR}/"
# +1 vendor layer priority(6)
BBFILE_PRIORITY_meta-wm-bsp = "7"

LAYERDEPENDS_meta-wm-bsp = "core"
LAYERSERIES_COMPAT_meta-wm-bsp = "wrynose"
